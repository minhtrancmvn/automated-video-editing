# External SSD paths are examples. Missing mounts fail; no internal fallback exists.
[paths]
input_dir = "/Volumes/TravelSSD/footage"
workspace_dir = "/Volumes/TravelSSD/video-editor/workspace"
cache_dir = "/Volumes/TravelSSD/video-editor/cache"
output_dir = "/Volumes/TravelSSD/video-editor/output"
# Small persistent SQLite job state may stay on internal storage.
state_dir = "~/Library/Application Support/video-editor"

[settings]
# Keep 10 GiB free beyond each write-stage estimate.
storage_reserve_bytes = 10737418240
# false retains local-only Phase 1. true selects Phase 2, but production Gemini
# pricing is intentionally unavailable until custom-FPS token charges are verified.
cloud_enabled = false
# Phase 1 renders serially.
render_concurrency = 1

[gemini]
# Credential stays runtime-only in GEMINI_API_KEY; never put it in this file.
enabled = false
model = "gemini-3.8-flash"
broad_fps = "0.5"
candidate_min_fps = 2
candidate_max_fps = 5
max_cost_per_source_hour_usd = "1.00"

[highlights]
max_short_count = 5
long_max_seconds = 1800
short_max_seconds = 180
cross_short_overlap_ratio = "0.10"

[crop]
max_velocity_widths_per_second = "0.25"
max_acceleration_widths_per_second_squared = "0.50"
safe_margin_ratio = "0.05"
minimum_subject_retention_ratio = "0.95"
max_fallback_hold_seconds = "2"
